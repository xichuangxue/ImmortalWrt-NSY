name: bd-one

on:
  workflow_dispatch:
    inputs:
      network_mode:
        description: 'Default ports: router = RGMII WAN + PCIe LAN; lan = all LAN'
        type: choice
        options:
          - router
          - lan
        default: router

permissions:
  contents: write

env:
  REPO_URL: https://github.com/zhoufuli/immortalwrt-rk356x
  REPO_BRANCH: main
  CONFIG_FILE: configs/bd-one-docker.config
  DIY_SCRIPT: diy-mini.sh
  CLASH_KERNEL: arm64
  CACHE_TOOLCHAIN: true
  SKIP_FEED_UPDATE: '1'
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  Build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check Runner Performance
        timeout-minutes: 2
        run: |
          date -Is
          printf 'Runner: %s; OS: %s; architecture: %s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          cat /etc/os-release
          lscpu
          nproc
          free -h
          df -hT
          cpu_jobs=$(nproc)
          memory_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          memory_jobs=$((memory_kib / 3145728))
          [ "$memory_jobs" -ge 1 ] || memory_jobs=1
          build_jobs=$cpu_jobs
          [ "$build_jobs" -le "$memory_jobs" ] || build_jobs=$memory_jobs
          echo "OPENWRT_BUILD_JOBS=$build_jobs" >> "$GITHUB_ENV"
          printf 'Build parallelism: %s jobs (CPU=%s, memory limit=%s)\n' "$build_jobs" "$cpu_jobs" "$memory_jobs"

      - name: Merge Disks
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization Environment
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          echo "::group::Free disk space $(date -Is)"
          df -hT
          docker images -q | xargs -r docker rmi || true
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          echo '::endgroup::'
          # Keep the runner's installed tools and their dependencies. Bulk purge
          # and autoremove can spend the entire job in dpkg configuration scripts.
          echo "::group::APT update $(date -Is)"
          sudo -E apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 -y update
          echo '::endgroup::'
          echo "::group::Install build dependencies $(date -Is)"
          # Keep the Ubuntu 22.04 build dependencies here instead of a remote short URL.
          sudo -E apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 -y install --no-install-recommends \
            asciidoc autoconf automake autopoint bc binutils binutils-gold bison \
            build-essential bzip2 ca-certificates ccache clang cmake cpio curl \
            device-tree-compiler file flex gawk gettext git gperf \
            help2man intltool libbsd-dev libelf-dev libffi-dev libfuse-dev libglib2.0-dev \
            libgmp-dev libltdl-dev liblzma-dev libmpc-dev libmpfr-dev \
            libncurses-dev libreadline-dev libssl-dev libtool libzstd-dev \
            lld llvm lz4 lzop make meson mtools ninja-build p7zip-full \
            patch pkg-config python3 python3-dev python3-distutils python3-pip \
            python3-ply python3-pyelftools python3-setuptools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig \
            tar texinfo time u-boot-tools unzip uuid-dev wget xmlto xsltproc xxd \
            xz-utils zlib1g-dev zstd
          echo '::endgroup::'
          sudo -E apt-get -y clean
          sudo timedatectl set-timezone "$TZ"
          date -Is
          df -hT

      - name: Clone Source Code
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workdir"
          git clone --single-branch -b "$REPO_BRANCH" "$REPO_URL" "$GITHUB_WORKSPACE/workdir/openwrt"
          cd "$GITHUB_WORKSPACE/workdir/openwrt"
          echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fix Binutils Host Library Paths
        working-directory: ${{ env.OPENWRT_PATH }}
        run: |
          # Match upstream OpenWrt: host binutils must use host zstd, even when
          # a restored toolchain already contains target musl headers/libraries.
          if grep -Fqx 'export ZSTD_CFLAGS=-I$(STAGING_DIR_HOST)/include -pthread' toolchain/binutils/Makefile &&
             grep -Fqx 'export ZSTD_LIBS=-L$(STAGING_DIR_HOST)/lib -lzstd -lpthread' toolchain/binutils/Makefile; then
            echo 'Binutils host zstd paths already fixed upstream.'
          else
            patch --batch --forward -p1 < "$GITHUB_WORKSPACE/patches/bd-one/010-binutils-host-zstd.patch"
          fi

      # Register the device before defconfig, or its CONFIG_TARGET selection is lost.
      - name: Install BD-One Board Support
        env:
          NETWORK_MODE: ${{ inputs.network_mode }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/prepare-bd-one.py" "$OPENWRT_PATH" --network-mode "$NETWORK_MODE"
          dtc -q -I dts -O dtb -o "$RUNNER_TEMP/rk3568-bd-one.dtb" "$OPENWRT_PATH/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3568-bd-one.dts"

      - name: Install Feeds
        working-directory: ${{ env.OPENWRT_PATH }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Variables
        id: variables
        run: |
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" "$OPENWRT_PATH/.config"
          cd "$OPENWRT_PATH"
          make defconfig
          grep -qx 'CONFIG_TARGET_rockchip_armv8_DEVICE_bendian_bd-one=y' .config
          cache_digest=$(
            {
              printf '%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$SOURCE_COMMIT"
              sha256sum < "$GITHUB_WORKSPACE/$CONFIG_FILE"
              sha256sum < "$GITHUB_WORKSPACE/$DIY_SCRIPT"
              sha256sum < "$GITHUB_WORKSPACE/patches/bd-one/010-binutils-host-zstd.patch"
              for feed in packages luci routing telephony; do
                git -C "feeds/$feed" rev-parse HEAD
              done
            } | sha256sum | cut -d ' ' -f1
          )
          echo "cache_key=bd-one-host-v2-$cache_digest" >> "$GITHUB_OUTPUT"

      - name: Restore Build Cache
        id: build_cache
        if: env.CACHE_TOOLCHAIN == 'true'
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.variables.outputs.cache_key }}
          path: |
            ${{ env.OPENWRT_PATH }}/staging_dir/host*
            ${{ env.OPENWRT_PATH }}/staging_dir/toolchain-*
            ${{ env.OPENWRT_PATH }}/staging_dir/target-*/host
            ${{ env.OPENWRT_PATH }}/build_dir/host*
            ${{ env.OPENWRT_PATH }}/build_dir/toolchain-*
            ${{ env.OPENWRT_PATH }}/build_dir/target-*/host

      - name: Load Custom Configuration
        env:
          NETWORK_MODE: ${{ inputs.network_mode }}
        run: |
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            mkdir -p "$OPENWRT_PATH/files"
            cp -a "$GITHUB_WORKSPACE/files/." "$OPENWRT_PATH/files/"
          fi
          python3 "$GITHUB_WORKSPACE/scripts/prepare-bd-one.py" "$OPENWRT_PATH" --network-mode "$NETWORK_MODE"
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" "$OPENWRT_PATH/.config"
          chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT" "$GITHUB_WORKSPACE"/scripts/*.sh
          cd "$OPENWRT_PATH"
          "$GITHUB_WORKSPACE/$DIY_SCRIPT"
          "$GITHUB_WORKSPACE/scripts/preset-clash-core.sh" "$CLASH_KERNEL"

      - name: Download DL Package
        working-directory: ${{ env.OPENWRT_PATH }}
        run: |
          make defconfig
          for option in \
            CONFIG_TARGET_rockchip_armv8_DEVICE_bendian_bd-one \
            CONFIG_PACKAGE_kmod-ata-ahci-dwc \
            CONFIG_PACKAGE_kmod-r8169 \
            CONFIG_PACKAGE_luci-app-hd-idle \
            CONFIG_PACKAGE_luci-app-aria2 \
            CONFIG_PACKAGE_luci-app-nfs; do
            grep -qx "$option=y" .config
          done
          make download -j8
          find dl -type f -size -1024c -print -delete

      - name: Build Toolchain
        working-directory: ${{ env.OPENWRT_PATH }}
        run: |
          date -Is
          make toolchain/install -j"$OPENWRT_BUILD_JOBS" || make toolchain/install -j1 V=s
          date -Is

      # Save before the long package/image build so a later timeout does not
      # discard the completed toolchain and Rust host compiler from the DIY step.
      - name: Save Build Cache Before Firmware Compilation
        if: env.CACHE_TOOLCHAIN == 'true' && steps.build_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.variables.outputs.cache_key }}
          path: |
            ${{ env.OPENWRT_PATH }}/staging_dir/host*
            ${{ env.OPENWRT_PATH }}/staging_dir/toolchain-*
            ${{ env.OPENWRT_PATH }}/staging_dir/target-*/host
            ${{ env.OPENWRT_PATH }}/build_dir/host*
            ${{ env.OPENWRT_PATH }}/build_dir/toolchain-*
            ${{ env.OPENWRT_PATH }}/build_dir/target-*/host

      - name: Compile Firmware
        id: compile
        working-directory: ${{ env.OPENWRT_PATH }}
        run: |
          mkdir -p files/etc/uci-defaults
          cp "$GITHUB_WORKSPACE/scripts/init-settings.sh" files/etc/uci-defaults/99-init-settings
          date -Is
          printf 'Compile firmware with %s jobs\n' "$OPENWRT_BUILD_JOBS"
          make -j"$OPENWRT_BUILD_JOBS" || make -j1 V=s
          date -Is
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"

      - name: Organize BD-One Images
        run: |
          FIRMWARE_PATH="$OPENWRT_PATH/bin/targets/rockchip/armv8"
          cd "$FIRMWARE_PATH"
          shopt -s nullglob
          images=( *-bendian_bd-one-squashfs-sysupgrade.img.gz )
          [ "${#images[@]}" -eq 1 ]
          cp "$OPENWRT_PATH/.config" build.config
          cp "$OPENWRT_PATH/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3568-bd-one.dts" .
          cp "$GITHUB_WORKSPACE/boards/bd-one/bootloader.json" bootloader-source.json
          dtbs=( "$OPENWRT_PATH"/build_dir/target-*/linux-rockchip_armv8/image-rk3568-bd-one.dtb )
          [ "${#dtbs[@]}" -eq 1 ]
          cp "${dtbs[0]}" rk3568-bd-one.dtb
          kernels=( "$OPENWRT_PATH"/build_dir/target-*/linux-rockchip_armv8/linux-*/arch/arm64/boot/Image )
          [ "${#kernels[@]}" -eq 1 ]
          cp "${kernels[0]}" Image
          rootfs=( *-rootfs.tar.gz )
          [ "${#rootfs[@]}" -eq 1 ]
          cp "${rootfs[0]}" rootfs.tar.gz
          sha256sum "${images[0]}" Image rk3568-bd-one.dtb rootfs.tar.gz > bd-one-sha256sums
          # Release assets must be files. Stage top-level files separately so
          # the upload glob cannot match the OpenWrt packages directory.
          release_path=$(mktemp -d "$RUNNER_TEMP/bd-one-release.XXXXXX")
          find -L "$FIRMWARE_PATH" -maxdepth 1 -type f -exec cp -t "$release_path" -- {} +
          if [ -d "$FIRMWARE_PATH/packages" ]; then
            # Package entries can be symlinks into bin/packages; include their contents.
            tar --dereference -czf "$release_path/packages.tar.gz" -C "$FIRMWARE_PATH" packages
          fi
          echo "FIRMWARE_PATH=$release_path" >> "$GITHUB_ENV"

      - name: Upload Firmware To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bd-one-${{ env.TAG_DATE }}
          path: ${{ env.FIRMWARE_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload Firmware To Release
        uses: ncipollo/release-action@v1
        with:
          name: BD-One ${{ env.TAG_DATE }}
          tag: ${{ env.TAG_DATE }}-bd-one
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
          artifactErrorsFailBuild: true
          body: |
            ImmortalWrt for BenDian BD-One (RK3568).
            Source: ${{ env.REPO_URL }} @ ${{ env.SOURCE_COMMIT }}
            Network mode: ${{ inputs.network_mode }}
            Includes native SATA AHCI DWC, Docker, hd-idle, Aria2 and NFS.
            Bootloader: extracted from the supplied vendor Armbian image; see bootloader-source.json.
            Flash the bendian_bd-one-squashfs-sysupgrade.img.gz disk image.
            Image, rk3568-bd-one.dtb and rootfs.tar.gz are also included.
            Target packages are bundled in packages.tar.gz when present.

      - name: Check Space Usage
        if: always()
        run: df -hT
